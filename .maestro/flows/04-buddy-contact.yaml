appId: app.novaku.mobile
name: Open a Buddy post and start a chat
tags:
  - smoke
---
- runFlow:
    file: ../subflows/login.yaml
- tapOn:
    id: tab.buddy
# login.yaml clears state, so a first-run Buddy walkthrough (D-054) starts here
# and its step card floats over the feed. Dismiss it before touching a post.
- runFlow:
    when:
      visible:
        id: buddy.guide.spotlight.feed
    commands:
      - tapOn:
          id: guide.card.skip-all
- extendedWaitUntil:
    visible:
      id: buddy.post.contactable
    timeout: 30000
- tapOn:
    id: buddy.post.contactable
    index: 0
- extendedWaitUntil:
    visible:
      id: buddy.contact
    timeout: 20000
- tapOn:
    id: buddy.contact
- extendedWaitUntil:
    visible:
      id: chat.composer.input
    timeout: 30000
