name: Cover screenshots (Android emulator)

# The text covers (D-164 / D-166) are drawn on the device in the reader's own
# fonts, so the only proof that a native build lays them out right is a native
# build on a screen. This builds the preview APK of the commit it runs on,
# opens the cover gallery (app/dev/plaza-cover) on an emulator, scrolls through
# it and uploads the screenshots. It installs nothing anywhere and submits
# nothing; it needs only the secrets the Android build already uses.

on:
  workflow_dispatch:

concurrency:
  group: cover-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Build preview APK and photograph the covers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ALLOW_FAILURE: 'true'
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      CI: 1
      npm_config_progress: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install eas-cli and dependencies
        run: |
          npm install -g eas-cli@latest
          eas whoami
          npm ci --prefer-offline --no-audit --no-fund

      - name: Inject Maps key into eas.json env (eas-cli #3248 workaround)
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            j.build.preview.env = j.build.preview.env || {};
            j.build.preview.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = process.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || "";
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2) + "\n");
          '

      - name: Build preview APK (eas build --local)
        run: eas build --platform android --profile preview --local --non-interactive --output ./postervia-preview.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photograph the cover gallery on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci/cover-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-screenshots-${{ github.run_number }}
          path: shots/
          retention-days: 14
          if-no-files-found: warn
