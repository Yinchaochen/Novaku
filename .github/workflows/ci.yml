name: app-ci

# Runs on every push and PR. The only other workflow (ios-build.yml) is
# workflow_dispatch-only, so until now nothing type-checked the app on push.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs patch-package (RN/iOS-26 safe-area-context patch) —
      # npm ci runs it automatically, so the patched tree is what tsc sees.
      - name: Install
        run: npm ci

      # UI-system gate: manifest paths resolve, extracted recipes don't regress
      # inline, tab screens don't hand-code tab-bar clearance (D-037).
      - name: UI system gate
        run: npm run verify:ui

      # Emit the git-ignored .expo/types/router.d.ts (typed routes). Locally the
      # dev server writes it; a fresh CI checkout has none, and this is Expo's
      # documented no-dev-server way to generate it. Without it useSegments()
      # degrades to the 1-tuple [string], so segments[1] in app/_layout.tsx is a
      # TS2493 error — green locally, red in CI. Leaves tsconfig.json untouched.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      # tsconfig extends expo/tsconfig.base with strict:true. No eslint config
      # exists in this project, so the type-checker is the gate. Typed routes are
      # emitted by the step above, so CI validates the same Href types as local.
      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests (jest-expo): pure logic + the MS-16 optimistic-send path
      # (outbox, network-health thresholds, image compression, mutation
      # defaults). --ci disables snapshot auto-write.
      - name: Unit tests
        run: npx jest --ci
