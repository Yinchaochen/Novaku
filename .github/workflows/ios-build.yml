name: iOS Build & Submit (free local via macOS runner)

# 设计哲学：
#  - 用 `eas build --platform ios --local` 在 GitHub macOS runner 上跑构建。
#  - Expo 官方文档明确：local builds 不计入 EAS cloud quota。
#  - GitHub Actions 私有 repo 提供每月 2000 分钟 macOS runner 免费额度。
#  - macos-15 runner 镜像本身已经预装 Xcode + CocoaPods + Fastlane + Ruby。
#    所以这个 workflow 只需要装 Node 和 eas-cli，剩下全靠 image 自带。
#
# 必需的 secrets （在 GitHub repo Settings → Secrets and variables → Actions）：
#  - EXPO_TOKEN: 在 https://expo.dev/accounts/lisumchen/settings/access-tokens
#                 生成一个新 token。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      submit:
        description: 'Submit to TestFlight after build'
        required: true
        default: true
        type: boolean
      clear_cache:
        description: 'Clear EAS build cache (slow but clean)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA on macOS runner
    # Pin 到 macos-26，不再用 macos-latest（Build #60 教训）：macos-latest 是
    # GitHub 会迁移的别名，迁移窗口里（6/15–7/15 macos-15→26）同一 commit 两次
    # 构建落在不同镜像上，工具链漂移直接炸发布管道。pin 后大版本跳变由我们择时。
    # 注意：label 内镜像每周仍滚动更新（默认 Xcode 会变），那类漂移靠 step 3b
    # 的健壮选择 + downloadPlatform 兜底，这里的 pin 只挡大版本跳变。
    # ⏰ 复查触发点（预计 2027 年春两件事同时到）：
    #   1) Apple 把上传要求提到 iOS 27 SDK（历年 4 月节奏）→ 升 macos-27 +
    #      同步改 step 3b 的 iphoneos26 grep
    #   2) GitHub 宣布 macos-26 退役（通常 ~1.5 年）→ 到期不升会排队/报错
    # 历史：macos-15 默认 Xcode 16.x / iOS 18.5 SDK → TestFlight 被 Apple 拒绝
    #   "All iOS and iPadOS apps must be built with the iOS 26 SDK or later"
    runs-on: macos-26
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # SENTRY_AUTH_TOKEN: 用于 @sentry/react-native 插件在 build 结束时
      # 上传 sourcemap + dSYM 到 Sentry。EAS Cloud builds 可以从 EAS server
      # 端读 SECRET 类型的 env var，但 `eas build --local` 只能读 Plain /
      # Sensitive 类型 —— SECRET 故意被禁。所以我们在 GitHub Secrets 里独立
      # 存一份，通过 workflow env 注入构建上下文。
      # 如果 secret 不存在，build 末尾 sentry-cli 会报：
      #   "Auth token is required for this request"
      # 解决：在 https://postervia.sentry.io/settings/account/api/auth-tokens/
      # 创建一个新 token（scopes: org:read + project:releases + project:write）
      # 然后在 https://github.com/Yinchaochen/Novaku/settings/secrets/actions
      # 加名为 SENTRY_AUTH_TOKEN 的 secret。
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Sentry dSYM 上传是 archive 完成后的一个 script phase。Sentry 服务端偶尔
      # 抽风返回 5xx（实测 Build #21 跑 16 分钟到 archive 全绿，最后挂在 sentry-cli
      # 报 "API request failed - internal server error (http status: 500)"）。
      # SENTRY_ALLOW_FAILURE=true 让 sentry-cli 把上传错误降级为 warning 并 exit 0，
      # IPA 还是能正常产出 + 上 TestFlight。代价：这次 build 在 Sentry 里的
      # crash symbolication 可能不完整，可以事后手动 sentry-cli debug-files upload。
      SENTRY_ALLOW_FAILURE: 'true'
      # EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: 用于 GooglePlacesAutocomplete (Plaza Add
      # Location 搜索框)、react-native-maps 的 iOS/Android Maps SDK key 注入
      # (via app.config.js)、地图 reverse-geocode。本地 dev 走 .env (gitignored);
      # GHA / EAS production 必须从 GitHub Secret 注入,否则 metro bundler 拿到的
      # process.env 是 undefined → GooglePlacesAutocomplete 直接 bail 不渲染 input,
      # native Maps SDK 在 iOS 上 fall back 到 Apple Maps。
      # 注意:这是 client-side public key,在 app bundle 里反正都能被提取出来 ——
      # 真正的安全是在 GCP 控制台给 key 加 Application Restriction (绑 bundle ID +
      # SHA-1),目前 (2026-05-12) 还没绑,v1 上架前必须补。
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      CI: 1
      npm_config_progress: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      # ── 1. 检出仓库 ──────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. 安装 Node 20 LTS ──────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3a. 列出所有可用 Xcode 版本（debug） ────────────────────────
      - name: List available Xcode versions
        run: |
          echo "=== /Applications 下所有 Xcode*.app ==="
          ls -la /Applications | grep -i Xcode || echo "(none)"
          echo ""
          echo "=== 当前 active Xcode ==="
          xcode-select -p
          xcodebuild -version

      # ── 3b. 选择 Xcode 26（含 iOS 26 SDK）─────────────────────────
      # Apple 2026 起要求上传 ASC 的 app 必须用 iOS 26 SDK 编译。
      # GitHub runner 多 Xcode 并存，但只有默认 Xcode（/Applications/Xcode.app）
      # 预装了 iOS platform 组件；其他版本 SDK 在但 platform 没下载，archive 时
      # 报 "iOS 26.0 is not installed"（Build #60 教训：glob 字母序选中最老的
      # Xcode_26.0.1 → exit 70）。所以默认 Xcode 优先，其余 26.x 从新到旧兜底。
      - name: Select Xcode with iOS 26 SDK
        run: |
          set -e
          XCODE_PATH=""
          CANDIDATES="/Applications/Xcode.app $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -rV) /Applications/Xcode-beta.app /Applications/Xcode_latest.app"
          for candidate in $CANDIDATES; do
            [ -d "$candidate" ] || continue
            sudo xcode-select -switch "$candidate" 2>/dev/null || continue
            ACTUAL_SDKS=$(xcodebuild -showsdks 2>/dev/null | grep -i "iphoneos" || echo "(none)")
            echo "Candidate: $candidate"
            echo "  SDKs: $ACTUAL_SDKS"
            if echo "$ACTUAL_SDKS" | grep -qi "iphoneos26"; then
              echo "  ✅ has iOS 26 SDK — using this Xcode"
              XCODE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode with iOS 26 SDK found on this runner."
            echo "::error::Apple requires iOS 26 SDK for App Store submission since 2026."
            echo "::error::Available Xcode versions:"
            ls /Applications | grep -i Xcode
            echo "::error::Available iOS SDKs (using current Xcode):"
            xcodebuild -showsdks | grep iphoneos
            exit 1
          fi

          # platform 组件保险：已安装则秒过（no-op）；万一选中的 Xcode 没装
          # iOS platform，这里现场下载，避免拖到 archive 阶段才炸
          sudo xcodebuild -downloadPlatform iOS

          echo "=== Final Xcode selection ==="
          xcode-select -p
          xcodebuild -version
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep iphoneos

      # ── 3c. 验证预装的 CocoaPods + Fastlane + Ruby ─────────────────
      - name: Verify preinstalled iOS toolchain
        run: |
          echo "=== CocoaPods ==="
          pod --version
          echo ""
          echo "=== Fastlane ==="
          fastlane --version | head -3
          echo ""
          echo "=== Ruby (system) ==="
          ruby --version
          echo "Ruby bin path: $(which ruby)"
          echo "Fastlane path: $(which fastlane)"

      # ── 4. 装 eas-cli 全局（pin 固定版本，不用 @latest）──────────────
      # eas-cli 每周多次发版，@latest = Expo 的回归零预警直进发布管道
      # （下面的 #3248 workaround 就是这么来的伤疤）。pin 后升级时机自己定：
      # 随 Expo SDK 升级（54→55）或需要已修复的 bug 时主动 bump。
      # eas-cli-local-build-plugin 的版本由 eas-cli 自选，pin 这里即间接固定。
      - name: Install eas-cli
        run: |
          npm install -g eas-cli@21.0.2
          eas --version

      # ── 5. 验证 EAS 认证 ────────────────────────────────────────────
      - name: Verify EAS auth
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret missing. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          eas whoami

      # ── 5b. 验证 Sentry auth token（必须，否则 build 末尾上传 sourcemap 时失败）
      - name: Verify SENTRY_AUTH_TOKEN
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN secret missing."
            echo "::error::Get one at https://postervia.sentry.io/settings/account/api/auth-tokens/"
            echo "::error::Scopes needed: org:read + project:releases + project:write"
            echo "::error::Add as 'SENTRY_AUTH_TOKEN' (exact name, all caps) at:"
            echo "::error::https://github.com/Yinchaochen/Novaku/settings/secrets/actions"
            exit 1
          fi
          echo "SENTRY_AUTH_TOKEN is set (length ${#SENTRY_AUTH_TOKEN})"

      # ── 5c. 验证 Google Maps API key（必须,否则 LocationPicker / PlacePicker
      #       的 MapView 在 iOS 上渲染空白卡片;GooglePlacesAutocomplete 也不渲染）
      # 这一步是 RETROSPECTIVES Rule 1 防御性 check —— GitHub Action secrets 在
      # secret 不存在时会 silently 求值成空字符串,build 会"成功"但产出废 binary。
      # 2026-05-26 实战教训:Build 34 用空 key 跑完,用户装上看到空白 map 才发现。
      - name: Verify EXPO_PUBLIC_GOOGLE_MAPS_API_KEY
        run: |
          if [ -z "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}" ]; then
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY secret missing."
            echo "::error::Without this, MapView (Plaza Add Location / Social Create"
            echo "::error::Meetup) renders blank on iOS — Google Maps SDK can't init."
            echo "::error::Get key from GCP Console (the one in your local .env)."
            echo "::error::Add as 'EXPO_PUBLIC_GOOGLE_MAPS_API_KEY' (exact name) at:"
            echo "::error::https://github.com/Yinchaochen/Novaku/settings/secrets/actions"
            exit 1
          fi
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set (length ${#EXPO_PUBLIC_GOOGLE_MAPS_API_KEY})"

      # ── 6. 装 npm 依赖（patch-package 通过 postinstall 自动应用）─────
      - name: Install npm dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          echo "--- patches/ 内容 ---"
          ls -la patches/

      # ── 6b. 把 Maps key 注入 eas.json env（修复地图空白 / iOS 回退 Apple Maps）──
      # `eas build --local` 不读 GitHub Actions 的 shell env（eas-cli #3248），
      # 只读 eas.json 的 env 块 + EAS 服务器端环境变量。所以上面 env: 里的
      # EXPO_PUBLIC_GOOGLE_MAPS_API_KEY 进不了 build → app.config.js 注入空 key →
      # iOS native Maps SDK 拿不到 key（空白 / 回退 Apple Maps，违反 no-Apple-Maps 规则）。
      # 这里在 runner 上把 Secret 临时写进 eas.json 的 env（不提交、构建完即弃）。
      - name: Inject Maps key into eas.json env (eas-cli #3248 workaround)
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const k = process.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || "";
            for (const p of ["development", "preview", "production"]) {
              j.build[p].env = j.build[p].env || {};
              j.build[p].env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = k;
            }
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2) + "\n");
          '
          echo "Injected EXPO_PUBLIC_GOOGLE_MAPS_API_KEY into eas.json env (CI-only, length ${#EXPO_PUBLIC_GOOGLE_MAPS_API_KEY})"

      # ── 7. 跑 EAS Build (local mode) ─────────────────────────────────
      - name: Build iOS IPA (eas build --local)
        run: |
          set -e
          BUILD_FLAGS="--platform ios --profile ${{ github.event.inputs.profile }} --local --non-interactive --output ./postervia.ipa"
          if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --clear-cache"
          fi
          echo "Running: eas build $BUILD_FLAGS"
          eas build $BUILD_FLAGS

      # ── 8. 上传 IPA 作为 workflow artifact ──────────────────────────
      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postervia-ios-ipa-${{ github.run_number }}
          path: ./postervia.ipa
          retention-days: 7
          if-no-files-found: warn

      # ── 9. 提交到 TestFlight (eas submit) ───────────────────────────
      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit == 'true' && success() }}
        run: |
          set -e
          eas submit --platform ios --path ./postervia.ipa --non-interactive

      # ── 10. 报告下一步 ───────────────────────────────────────────────
      - name: Print next steps
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "Build run #${{ github.run_number }} ended (status: ${{ job.status }})."
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ IPA built + uploaded as artifact."
            if [ "${{ github.event.inputs.submit }}" = "true" ]; then
              echo "✅ Submitted to TestFlight. Apple processing ~5-15 min."
            fi
          else
            echo "❌ Build failed. Check the failed step's logs above."
          fi
          echo "═══════════════════════════════════════════════════════════"
