name: Android Build & Submit (free local via Ubuntu runner)

# 设计哲学：跟 iOS workflow 对称。
#  - 用 `eas build --platform android --local` 在 GitHub Ubuntu runner 上跑构建。
#  - Expo 官方文档明确：local builds 不计入 EAS cloud quota。
#  - ubuntu-latest 自带 Java 17 + Android SDK + Gradle，所以这个 workflow
#    只需要装 Node + eas-cli。
#  - 私有 repo 的 ubuntu runner 每月 2000 分钟免费额度（macOS 是 10×乘数，
#    Linux 是 1×，所以 Linux 比 macOS 便宜 10 倍）。
#
# 必需的 secrets （在 GitHub repo Settings → Secrets and variables → Actions）：
#  - EXPO_TOKEN: 跟 iOS workflow 共用，已配置
#  - SENTRY_AUTH_TOKEN: 跟 iOS workflow 共用，已配置
#  - GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: 仅当 submit=true 时必需。
#      生成方式：将 google-service-account.json 整个文件
#      `base64 -w 0 google-service-account.json | pbcopy`（macOS）
#      然后粘到 GitHub Secret 里。
#      第一次跑 build 时建议 submit=false，先验证 AAB 能产出，
#      然后再配 secret 启用 submit。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      submit:
        description: 'Submit to Google Play after build (requires GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 secret)'
        required: true
        default: false
        type: boolean
      clear_cache:
        description: 'Clear EAS build cache (slow but clean)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android AAB/APK on Ubuntu runner
    runs-on: ubuntu-latest
    # Run #37 was cancelled at 60 minutes while still compiling native code for
    # four ABIs — everything before that (npm ci, prebuild, Metro bundle, every
    # Kotlin/Java module) had already succeeded. plugins/withAndroidBuildTuning
    # now halves the native work on production builds; this ceiling exists so a
    # cold runner still has room instead of throwing away 60 minutes of work.
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
      # EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: 跟 iOS workflow 同款,需要从 GitHub Secret
      # 注入,否则 LocationPicker (Plaza Add Location 搜索框) + PlacePicker (Social
      # Create Meetup 选址) 在产线 build 里都拿不到 key,GooglePlacesAutocomplete
      # bail 不渲染。
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      CI: 1
      npm_config_progress: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      # ── 1. 检出仓库 ──────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1b. 腾磁盘 ───────────────────────────────────────────────────
      # 2026-08-09: 一次运行死在 runner 自己的日志写入上——
      # `System.IO.IOException: No space left on device`。ubuntu-latest 根盘
      # 只有 ~20GB 可用，而这个构建要放 NDK 27（~5GB）、CMake、Gradle 缓存、
      # **两份** node_modules（仓库一份 + EAS 把工程复制到临时目录后再 npm ci
      # 一份），再加各 ABI 的原生目标文件。
      #
      # 删的都是这个构建用不到的预装工具链，逐条 `|| true`：路径缺失绝不能
      # 让构建失败。**不碰** /usr/local/lib/android（Android SDK 要用）和
      # hostedtoolcache 里的 node/java（后面两步就要装）。
      - name: Free disk space
        run: |
          echo "--- before ---"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/local/share/chromium /opt/google/chrome || true
          sudo docker image prune --all --force || true
          echo "--- after ---"; df -h / | tail -1

      # ── 2. 安装 Node 20 LTS ──────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. 安装 Java 17 (Android Gradle Plugin 8 需要) ───────────────
      # ubuntu-latest 默认 Java 是 21，但 RN 0.81 + AGP 8 推荐 17。
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. 验证 Android SDK 已存在 ───────────────────────────────────
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ | head -5
          ls $ANDROID_HOME/build-tools/ | head -5

      # ── 5. 装 eas-cli 全局 ───────────────────────────────────────────
      - name: Install eas-cli
        run: |
          npm install -g eas-cli@latest
          eas --version

      # ── 6. 验证 EAS 认证 ─────────────────────────────────────────────
      - name: Verify EAS auth
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret missing. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          eas whoami

      # ── 6b. 验证 Sentry auth token ──────────────────────────────────
      - name: Verify SENTRY_AUTH_TOKEN
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN secret missing."
            exit 1
          fi
          echo "SENTRY_AUTH_TOKEN is set (length ${#SENTRY_AUTH_TOKEN})"

      # ── 6c. 验证 Google Maps API key（防御性 loud-fail）─────────────
      # 跟 iOS workflow 同款保护:secret 不存在 → workflow 会 silently 用空字符串,
      # 产出的 AAB 里 MapView 渲染空白卡片。提前 fail。
      - name: Verify EXPO_PUBLIC_GOOGLE_MAPS_API_KEY
        run: |
          if [ -z "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}" ]; then
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY secret missing."
            echo "::error::Without this, MapView (Plaza Add Location / Social Create"
            echo "::error::Meetup) renders blank — Google Maps SDK can't init."
            echo "::error::Add the secret at:"
            echo "::error::https://github.com/Yinchaochen/Novaku/settings/secrets/actions"
            exit 1
          fi
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set (length ${#EXPO_PUBLIC_GOOGLE_MAPS_API_KEY})"

      # ── 7. 装 npm 依赖（patch-package 通过 postinstall 自动应用）─────
      - name: Install npm dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          echo "--- patches/ 内容 ---"
          ls -la patches/

      # ── 8. 还原 Google Service Account（仅当 submit=true）───────────
      - name: Restore Google Service Account
        if: ${{ github.event.inputs.submit == 'true' }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY_BASE64}" ]; then
            echo "::error::submit=true but GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 secret is missing."
            echo "::error::Either set submit=false, or add the secret."
            echo "::error::Generate: base64 -w 0 google-service-account.json"
            exit 1
          fi
          echo "${GOOGLE_SERVICE_ACCOUNT_KEY_BASE64}" | base64 -d > ./google-service-account.json
          echo "Wrote google-service-account.json ($(wc -c < ./google-service-account.json) bytes)"

      # ── 8b. 把 Maps key 注入 eas.json env（修复 Android 地图空白）──────
      # `eas build --local` 不读 GitHub Actions 的 shell env（eas-cli #3248），
      # 只读 eas.json 的 env 块 + EAS 服务器端环境变量。所以上面 env: 里的
      # EXPO_PUBLIC_GOOGLE_MAPS_API_KEY 进不了 build → app.config.js 注入空 key
      # → 原生 Maps 瓦片空白（OAuth client ID 因为本来就在 eas.json env 里所以没事）。
      # 这里在 runner 上把 Secret 临时写进 eas.json 的 env（不提交、构建完即弃），
      # 让 --local 构建真正拿到它。
      - name: Inject Maps key into eas.json env (eas-cli #3248 workaround)
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const k = process.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || "";
            for (const p of ["development", "preview", "production"]) {
              j.build[p].env = j.build[p].env || {};
              j.build[p].env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = k;
            }
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2) + "\n");
          '
          echo "Injected EXPO_PUBLIC_GOOGLE_MAPS_API_KEY into eas.json env (CI-only, length ${#EXPO_PUBLIC_GOOGLE_MAPS_API_KEY})"

      # ── 9. 跑 EAS Build (local mode) ─────────────────────────────────
      - name: Build Android (eas build --local)
        run: |
          set -e
          # production profile → AAB, preview/development → APK
          if [ "${{ github.event.inputs.profile }}" = "production" ]; then
            OUTPUT_FILE="./postervia.aab"
          else
            OUTPUT_FILE="./postervia.apk"
          fi
          BUILD_FLAGS="--platform android --profile ${{ github.event.inputs.profile }} --local --non-interactive --output $OUTPUT_FILE"
          if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --clear-cache"
          fi
          echo "Disk before build:"; df -h / | tail -1
          echo "Running: eas build $BUILD_FLAGS"
          eas build $BUILD_FLAGS

      # 构建成败都报一次剩余空间：下次再撞 "No space left on device" 时，
      # 这两个数字直接说明是余量不足还是某一步异常膨胀。
      - name: Report disk usage
        if: always()
        run: |
          echo "Disk after build:"; df -h / | tail -1
          du -sh /tmp/runner 2>/dev/null | tail -1 || true

      # ── 10. 上传 binary 作为 workflow artifact ──────────────────────
      - name: Upload AAB/APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postervia-android-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: |
            ./postervia.aab
            ./postervia.apk
          retention-days: 7
          if-no-files-found: warn

      # ── 11. 提交到 Google Play (eas submit) ─────────────────────────
      - name: Submit to Google Play
        if: ${{ github.event.inputs.submit == 'true' && success() && github.event.inputs.profile == 'production' }}
        run: |
          set -e
          eas submit --platform android --path ./postervia.aab --non-interactive

      # ── 12. 清理 Service Account（敏感文件不留在 runner 上）─────────
      - name: Clean up Service Account
        if: always()
        run: rm -f ./google-service-account.json

      # ── 13. 报告下一步 ──────────────────────────────────────────────
      - name: Print next steps
        if: always()
        run: |
          echo "::notice::Android build complete. Profile: ${{ github.event.inputs.profile }}"
          if [ "${{ github.event.inputs.submit }}" = "true" ]; then
            echo "::notice::Submission attempted — check Google Play Console → Internal testing track for the new draft."
          else
            echo "::notice::No submit requested. Download the binary from the workflow artifacts (postervia-android-*) above."
          fi
