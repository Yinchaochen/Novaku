title = "Novaku App Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Novaku app allowlist"
paths = [
  '''node_modules/''',
  '''(^|/)tests?/''',
  '''\.example$''',
  '''\.md$''',
  '''\.map$''',
  # Firebase Android config: the contained API key is restricted to the app
  # package + ships inside every APK, so it is not a secret (Google-documented).
  '''(^|/)google-services\.json$''',
]
regexes = [
  '''EXAMPLE''',
  '''placeholder''',
  '''your[_-]?(key|secret|token|password)''',
  '''<[A-Z_]+>''',
]
